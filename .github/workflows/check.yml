name: Check

# Runs the same guardrails as `npm run check` on every pull request, so a change that
# breaks the config, a schema, or the design system fails before it can be merged.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
